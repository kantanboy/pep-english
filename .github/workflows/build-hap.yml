name: Build HAP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  HOS_SDK_HOME: /home/runner/ohos-sdk/command-line-tools/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev
        shell: bash

      - name: Setup HarmonyOS CLI Tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: 6.1.1.280
          cache: true

      - name: Verify environment
        run: |
          echo "=== Java ==="
          java -version 2>&1
          echo "=== Node.js ==="
          node -v
          echo "=== hvigorw ==="
          which hvigorw
          hvigorw -v 2>&1
          echo "=== Environment ==="
          echo "HOS_SDK_HOME=$HOS_SDK_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "=== SDK Structure ==="
          ls -la $HOS_SDK_HOME/ 2>/dev/null || echo "SDK not found at HOS_SDK_HOME"
          echo "=== Project Structure ==="
          ls -la
        shell: bash

      - name: Install ohpm dependencies
        run: |
          ohpm config set strict_ssl false
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          echo "=== Installing root dependencies ==="
          ohpm install --no-daemon 2>&1 || echo "Root install warning"
          echo "=== Installing entry dependencies ==="
          cd entry && ohpm install --no-daemon 2>&1 || echo "Entry install warning"
          cd ..
        shell: bash

      - name: Build HAP (Debug)
        run: |
          echo "=== Starting build ==="
          echo "Current directory: $(pwd)"
          hvigorw clean --no-daemon 2>&1
          echo "=== Assembling HAP ==="
          hvigorw assembleHap --mode module \
            -p product=default \
            -p buildMode=debug \
            --no-daemon --stacktrace 2>&1
        shell: bash

      - name: Upload Debug HAP Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pep-english-debug
          path: entry/build/outputs/hap/debug/*.hap
          retention-days: 30

      - name: Build HAP (Release)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          hvigorw clean --no-daemon
          hvigorw assembleHap --mode module \
            -p product=default \
            -p buildMode=release \
            --no-daemon
        shell: bash

      - name: Upload Release HAP Artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: pep-english-release
          path: entry/build/outputs/hap/release/*.hap
          retention-days: 30
